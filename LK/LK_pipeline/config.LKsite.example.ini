[GENERAL]
# Select the likelihood method: LKhard or LKsite.
METHOD = LKsite

[INPUT]
FILE_LIST = file_list.txt
CHROM_FILE = chrom.txt

[OUTPUT]
PREPARED_DIR = output/prepared_posterior
FIXED_DIR = output/fixed_posterior
HMM_DIR = output/ahmm_bed
MERGED_DIR = output/merged
RANDOM_DIR = output/randomized
OBS_DIR = output/observed
BASELINE_DIR = output/baseline
FIGURE_DIR = output/figures

[PARAMETER]
# Posterior probability threshold used for ancestry-state blocks.
PROBABILITY_THRESHOLD = 0.9

# Maximum distance between consecutive informative sites within an ancestry block.
MAX_GAP = 4000

# Number of randomizations used to construct the null distribution.
ITERATIONS = 100

# Number of parallel workers used by the randomization step.
THREADS = 8

# Keep the two ancestries with the largest genome-wide contributions.
TOP_ANCESTRIES = 2

# LKsite-specific filter for the discarded Rank3 homozygous state.
# Set to 1.0 to disable this filter.
LKSITE_THIRD_STATE_MAX = 0.5

# Percentile used to define the significance threshold.
THRESHOLD_PERCENTILE = 97.5

[SLURM]
PARTITION = long
CPUS = 8
MEM = 40G
